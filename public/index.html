<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>雞米花留言板</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 30px auto; padding: 20px; background: #f4f4f9; }
        #chat-box { height: 350px; border: 1px solid #ccc; background: #fff; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .hidden { display: none; }
        input[type="text"] { padding: 5px; margin: 5px 0; }
    </style>
</head>
<body>

    <h2>雞米花留言板</h2>

    <!-- 身分設定區塊 -->
    <div id="login-section">
        <p>請輸入你的名字：</p>
        <input type="text" id="username-input" placeholder="例如: Abby 或 Bob">
        <br>
        <button id="login-btn">進入留言板</button>
    </div>

    <!-- 留言板主畫面 -->
    <div id="chat-section" class="hidden">
        <p>目前身分：<span id="my-name" style="font-weight: bold; color: #007bff;"></span></p>
        
        <div id="chat-box"></div>

        <textarea id="message-input" placeholder="寫下你的留言..." rows="3" style="width: 100%; resize: none;"></textarea>
        <br>
        <button id="send-btn" style="margin-top: 5px; padding: 5px 15px;">送出留言</button>
    </div>

    <!-- 引入 Socket.io 用戶端腳本 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        
        const myNameSpan = document.getElementById('my-name');
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let myUsername = '';

        loginBtn.addEventListener('click', () => {
            myUsername = usernameInput.value.trim();
            if (!myUsername) return alert('請輸入你的名字！');

            myNameSpan.textContent = myUsername;
            loginSection.classList.add('hidden');
            chatSection.classList.remove('hidden');
        });

        // 載入歷史永久留言
        socket.on('load-messages', (messages) => {
            chatBox.innerHTML = '';
            messages.forEach(msg => {
                appendMessage(msg.sender, msg.text, msg.timestamp);
            });
        });

        // 接收即時新留言
        socket.on('chat-message', (data) => {
            appendMessage(data.sender, data.text, data.timestamp);
        });

        // 發送留言
        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text) return;

            socket.emit('new-message', { sender: myUsername, text });
            messageInput.value = '';
        });

        function appendMessage(sender, text, time) {
            const div = document.createElement('div');
            div.className = 'message';
            // 讓換行符號也能正常顯示
            const formattedText = text.replace(/\n/g, '<br>');
            div.innerHTML = `<strong>${sender}</strong> <span style="font-size: 0.8em; color: #aaa;">(${time})</span><br>${formattedText}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
